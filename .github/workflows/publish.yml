name: publish

on:
  push:
    tags:
      - '*-v*'

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: Publish
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^([a-z][a-z0-9-]*)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a tag like core-v0.0.11: $TAG_NAME" >&2
            exit 1
          fi
          package="${BASH_REMATCH[1]}"
          version="${TAG_NAME##*-v}"
          package_dir="packages/$package/pkg"
          jq -e --arg name "@parshjs/$package" --arg version "$version" \
            '.name == $name and .version == $version and .private != true' \
            "$package_dir/package.json" > /dev/null
          git merge-base --is-ancestor HEAD origin/main
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/prepare

      - name: Check types and codestyle
        run: bun check:all

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build --force

      - name: Setup Node for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish to npm
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: npm publish --access public --provenance --workspaces=false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --generate-notes
