name: prepare-release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory name (core, codegen, env, files)
        required: true
        type: string
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: ./.github/actions/prepare

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bump package version
        id: release
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [[ ! "$PACKAGE" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "Invalid package directory name: $PACKAGE" >&2
            exit 1
          fi
          package_dir="packages/$PACKAGE/pkg"
          jq -e --arg name "@parshjs/$PACKAGE" \
            '.name == $name and .private != true' "$package_dir/package.json" > /dev/null
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "Invalid version bump: $BUMP" >&2; exit 1 ;;
          esac

          (cd "$package_dir" && npm version "$BUMP" --no-git-tag-version --ignore-scripts --workspaces=false)
          bun install --lockfile-only
          version=$(jq -r '.version' "$package_dir/package.json")
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"
          echo "tag=$PACKAGE-v$version" >> "$GITHUB_OUTPUT"

      - name: Configure git user
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit and push to release branch
        env:
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          git switch -c "release/$TAG_NAME"
          git add "$PACKAGE_DIR/package.json" bun.lock
          git commit -m "chore(release): $TAG_NAME"
          git push --set-upstream origin "release/$TAG_NAME"

      - name: Create release PR
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          Bumps the package version for **$TAG_NAME** and updates the Bun lockfile.

          After merging, tag the merge commit on main and push to trigger publishing:

          \`\`\`bash
          git switch main
          git pull --ff-only
          git tag $TAG_NAME
          git push origin $TAG_NAME
          \`\`\`
          EOF
          gh pr create \
            --base main \
            --head "release/$TAG_NAME" \
            --title "chore(release): $TAG_NAME" \
            --body-file "$RUNNER_TEMP/release-pr.md"
